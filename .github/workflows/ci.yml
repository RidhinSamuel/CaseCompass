name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ------------------------------------------------------------------
  # Backend: lint + smoke + unit tests (fast, no external services)
  # ------------------------------------------------------------------
  backend-fast:
    name: Backend • lint + smoke + unit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.11

      - name: Install dependencies (with dev extras)
        run: uv sync --extra dev

      - name: Lint (ruff)
        run: uv run ruff check app tests

      - name: Smoke tests
        run: uv run pytest -m smoke --maxfail=1

      - name: Unit tests
        run: uv run pytest -m unit --cov=app --cov-report=term-missing

  # ------------------------------------------------------------------
  # Backend: functional tests against real Postgres (+ pgvector)
  # ------------------------------------------------------------------
  backend-functional:
    name: Backend • functional (Postgres + pgvector)
    runs-on: ubuntu-latest
    needs: backend-fast
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: case_compass_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/case_compass_test
      REDIS_URL: redis://localhost:6379/0
      RABBITMQ_URL: amqp://guest:guest@localhost:5672/
      JWT_SECRET_KEY: ci-secret
      RUN_FUNCTIONAL_TESTS: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.11

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Run Alembic migrations
        run: uv run alembic upgrade head

      - name: Functional tests
        run: uv run pytest -m functional

  # ------------------------------------------------------------------
  # Frontend: lint, unit tests, and production build
  # ------------------------------------------------------------------
  frontend:
    name: Frontend • lint + test + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci || npm install

      - name: Lint
        run: npm run lint --if-present

      - name: Unit tests
        run: npm test -- --run

      - name: Build
        run: npm run build
